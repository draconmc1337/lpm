#
# /etc/lpm/lpm.conf — Lotus Package Manager configuration
#

# =============================================================================
# Build environment
# =============================================================================

# C compiler flags.
CFLAGS = -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2

# C++ compiler flags.
# If unset, inherits CFLAGS.
CXXFLAGS = -O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2

# Linker flags.
LDFLAGS = -Wl,-z,relro,-z,now

# Extra flags for make.
MAKEFLAGS = -j4

# C compiler.
CC = gcc

# C++ compiler.
CXX = g++

# Parallel build jobs.
# 0 = automatic.
JOBS = 0

# =============================================================================
# Paths
# =============================================================================

# Build workspace.
BUILDDIR = /var/cache/lpm

# Finished package archives.
PKGDEST = /var/cache/lpm

# Downloaded source cache.
SRCDEST = /var/cache/lpm

# Per-package build logs.
LOGDIR = /var/log/lpm

# File ownership database.
FILESDIR = /var/lib/lpm/files

# =============================================================================
# Download
# =============================================================================

# Download tool: auto, wget, or curl.
DOWNLOADER = auto

# Parallel downloads.
# 1 = enabled, 0 = sequential.
PARALLEL_DL = 1

# Max parallel download threads (1–16).
MAX_DL_THREADS = 4

# Verify GPG signatures when a .sig is present.
# 0 = disabled, 1 = enabled.
VERIFY_SIG = 0

# =============================================================================
# Build behaviour
# =============================================================================

# Keep extracted sources after build.
# 0 = remove, 1 = keep.
KEEP_SRC = 0

# Keep staging directory after install.
# 0 = remove, 1 = keep.
KEEP_PKG = 0

# Warn when free disk space is low.
# 1 = enabled, 0 = disabled.
CHECK_SPACE = 1

# Colored output.
# 1 = enabled, 0 = disabled.
COLOR = 1

# Compiler profile (see /etc/lpm/profiles/).
PROFILE = generic

# =============================================================================
# Package protection
# =============================================================================

# Packages that require --force to remove.
# Multiple lines are merged.
CriticalPkg = musl musl-dev ld-musl gcc binutils bash coreutils sed grep gawk
CriticalPkg = findutils tar make patch perl python3 openssl
CriticalPkg = linux dinit lpm busybox

# Packages skipped during system upgrades.
IgnorePkg =
