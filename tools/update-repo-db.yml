# .github/workflows/update-repo-db.yml
# Put this in repo-lotus/.github/workflows/
#
# Triggers: any push to main that touches a pkgbuild_ file or .lpkg file
# → auto-regenerates base.db / extra.db / lotus.db and commits back

name: Update repo.db

on:
  push:
    branches: [ main ]
    paths:
      - 'base/**/pkgbuild_*'
      - 'extra/**/pkgbuild_*'
      - 'lotus/**/pkgbuild_*'
      - 'base/**/*.lpkg'
      - 'extra/**/*.lpkg'
      - 'lotus/**/*.lpkg'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  gen-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can push back

      - name: Generate repo databases
        run: |
          # run from repo root — script expects relative paths
          chmod +x tools/gen-repo-db.sh 2>/dev/null || true

          for repo in base extra lotus; do
            if [ -d "$repo" ]; then
              sh tools/gen-repo-db.sh . "$repo"
            fi
          done

      - name: Commit and push updated repo.db files
        run: |
          git config user.name  "lpm-bot"
          git config user.email "lpm-bot@lotus-linux"

          # only commit if something actually changed
          if git diff --quiet; then
            echo ":: No repo.db changes — nothing to commit"
            exit 0
          fi

          git add base/repo.db extra/repo.db lotus/repo.db 2>/dev/null || \
          git add $(find . -name repo.db)

          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "ci: update repo.db [$CHANGED]"
          git push
